name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements.test.txt
      - run: python -m pip install -r requirements.lock.txt -r requirements.test.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check --select F821,F822,F823 src tests
      - run: python -m pytest -q
