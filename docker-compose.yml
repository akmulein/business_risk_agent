services:
  api:
    build: .
    command:
      - uvicorn
      - counterparty_verification.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - path: .env
        required: false
    environment:
      MCP_URL: http://mcp:8001/mcp
      MOCK_DATA_PATH: /app/data/counterparties.json
    ports:
      - "8000:8000"
    depends_on:
      - mcp

  mcp:
    build: .
    command: ["python", "-m", "counterparty_verification.mcp_server"]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
    ports:
      - "8001:8001"

  postgres:
    image: postgres:17-alpine
    profiles: ["database"]
    environment:
      POSTGRES_DB: counterparties
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
