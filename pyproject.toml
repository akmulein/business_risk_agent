[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "business-risk-agent"
version = "0.1.0"
description = "Grounded agentic counterparty verification MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "python-dotenv>=1.0",
  "pydantic-ai-slim[openrouter]>=2.39",
  "fastmcp>=2.0",
  "pymongo>=4.10",
  "tenacity>=9.0",
  "httpx2>=2.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "respx>=0.22",
  "httpx>=0.28",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live_llm: hits a real LLM provider; requires OPENROUTER_API_KEY, run separately from the default suite",
]
